name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Restore Needle asset cache
        uses: actions/cache@v4
        with:
          path: demo/public/needle
          key: needle2-07f3e789e993e8ecf69ef5409fd7558f5fe43202

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified Needle artifacts
        run: ./scripts/download-needle.sh

      - name: Validate
        run: |
          bun run check
          bun run test

      - name: Build demo
        run: bun run build:demo -- --base "${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
